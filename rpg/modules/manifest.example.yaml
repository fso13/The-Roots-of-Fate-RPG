# Манифест кампании: какие модули активны.
# Скопируйте в manifest.yaml и правьте под стол.

campaign:
  name: "Пример кампании"

modules:
  core: true
  tactical_combat: true    # глава 02 — упрощённый бой
  talent_trees: true       # глава 03
  magic: true              # глава 04 — магия как атака
  equipment: true          # глава 05
  bestiary: true           # глава 06
  wounds: false            # глава 07 — детальный учёт ран
  crits_and_fumbles: false # глава 08 — криты и промахи 6+6 / 1+1
  states: true             # глава 10 — состояния: сбитый с ног, оглушённый, разоружён и т.д.
  squads: true             # глава 11 — бой с отрядами (группы монстров, общий пул ран)
  character_progression: true  # глава 09 — создание и уровни (рекомендуется true)

  # Фэнтези: дополнительные тексты (не обязательны для ядра)
  fantasy_spells: true     # fantasy/01-zaklinaniya.md
  fantasy_skills: true     # fantasy/02-talanty-i-navyki.md
  fantasy_gear: true       # fantasy/03-snaryazhenie.md
  fantasy_bestiary: true   # modules/fantasy-bestiariy (my_modules/fantasy_bestiary/)
  fantasy_inventory: true  # fantasy/05-inventar.md — сетка сумки, слоты, второй комплект за спиной

  firearms: false
  vehicles: false

custom_modules:
  - path: "./my_modules/sea_faring"
    enabled: false
  - path: "./my_modules/noir_investigation"
    enabled: false   # для «Чёрного счёта» — включите true
  - path: "./my_modules/fahrenheit_books"
    enabled: false   # для «Пепел слов» — включите true
  - path: "./my_modules/hero_trap"
    enabled: false   # для «Зов из Чёрного шпиля» — включите true
  - path: "./my_modules/homm3/lore"
    enabled: false   # Heroes III — лор Антагарича
  - path: "./my_modules/homm3/magiya"
    enabled: false   # Heroes III — магия
  - path: "./my_modules/homm3/bestiariy"
    enabled: false   # Heroes III — бестиарий
  - path: "./my_modules/homm3/talanty"
    enabled: false   # Heroes III — таланты и навыки
  - path: "./my_modules/homm3/predmety"
    enabled: false   # Heroes III — товары, реликвии и артефакты
  - path: "./my_modules/homm3/adventure"
    enabled: false   # Heroes III — мини-приключение на одну сессию
  - path: "./my_modules/elden_ring/lore"
    enabled: false   # Elden Ring — лор Междуземья
  - path: "./my_modules/elden_ring/navyki"
    enabled: false   # Elden Ring — навыки
  - path: "./my_modules/elden_ring/talanty"
    enabled: false   # Elden Ring — таланты
  - path: "./my_modules/elden_ring/magiya"
    enabled: false   # Elden Ring — магия
  - path: "./my_modules/elden_ring/predmety"
    enabled: false   # Elden Ring — товары и предметы
  - path: "./my_modules/elden_ring/bestiariy"
    enabled: false   # Elden Ring — бестиарий
  - path: "./my_modules/elden_ring/adventure"
    enabled: false   # Elden Ring — мини-приключение на одну сессию
  - path: "./my_modules/gothic/oruzhie"
    enabled: false   # Готика — оружие
  - path: "./my_modules/gothic/bronya"
    enabled: false   # Готика — броня
  - path: "./my_modules/gothic/magiya"
    enabled: false   # Готика — магия
  - path: "./my_modules/gothic/talanty"
    enabled: false   # Готика — таланты
  - path: "./my_modules/gothic/adventure"
    enabled: false   # Готика — мини-приключение на одну сессию
  - path: "./my_modules/skyrim/oruzhie"
    enabled: false   # Скайрим — оружие
  - path: "./my_modules/skyrim/bronya"
    enabled: false   # Скайрим — броня
  - path: "./my_modules/skyrim/magiya"
    enabled: false   # Скайрим — магия
  - path: "./my_modules/skyrim/talanty"
    enabled: false   # Скайрим — таланты
  - path: "./my_modules/skyrim/bogi"
