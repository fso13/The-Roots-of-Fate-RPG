# GitHub Pages: статический сайт + PDF книг, модулей и приключений
name: pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Книги правил (A4 + Cairn) и ширма — иначе ссылки на сайте отдают 404
      - run: node scripts/build-pdf.mjs --audience player
      - run: node scripts/build-pdf.mjs --audience keeper
      - run: node scripts/build-pdf.mjs --audience all
      - run: node scripts/build-pdf-cairn.mjs --audience player
      - run: node scripts/build-pdf-cairn.mjs --audience keeper
      - run: node scripts/build-pdf-cairn.mjs --audience all
      - run: node scripts/build-pdf-screen.mjs
      - run: node scripts/build-pdf-pack.mjs --all-modules
      - run: node scripts/build-pdf-pack.mjs --all-adventures
      # Повторная сборка: страницы получают размеры и ссылки на уже созданные PDF
      - run: node website/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
